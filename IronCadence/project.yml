name: IronCadence
options:
  bundleIdPrefix: com.ironcadence
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IronCadence:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Iron Cadence
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Iron Cadence reads heart rate, resting heart rate, steps, sleep and weight (including data your Garmin watch syncs to Apple Health) to tailor training and show recovery.
        NSHealthUpdateUsageDescription: Iron Cadence saves your completed calisthenics sessions and active energy to Apple Health.
    entitlements:
      path: App/IronCadence.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ironcadence.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  IronCadenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: IronCadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IronCadence:
    build:
      targets:
        IronCadence: all
    test:
      targets:
        - IronCadenceTests
